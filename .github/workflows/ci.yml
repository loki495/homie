name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (Pint, PHPStan, Rector, Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          # sockets: merely *requiring* pestphp/pest-plugin-browser (a dev
          # dependency, for tests/Browser) makes every Pest test — not just
          # browser ones — eagerly allocate a port via socket_create_listen() in
          # a global afterEach hook. Without this extension the whole suite
          # errors out here too, exactly as it did for homie-app locally.
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, sockets
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Pint (style check)
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: ./vendor/bin/rector process --dry-run

      - name: Pest
        run: ./vendor/bin/pest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  browser:
    name: Browser tests (Pest + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env
        run: cp .env.example .env

      - name: Build the browser-test image
        run: docker compose --profile test build app-test

      - name: Install Composer dependencies
        run: docker compose --profile test run --rm app-test composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: docker compose --profile test run --rm app-test npm install

      - name: Build assets
        run: docker compose --profile test run --rm app-test npm run build

      - name: Generate app key
        run: docker compose --profile test run --rm app-test php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: docker compose --profile test run --rm app-test php artisan migrate --force

      - name: Pest (browser)
        run: docker compose --profile test run --rm app-test ./vendor/bin/pest tests/Browser

  publish-ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [php, frontend, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-compose.yml's `app` service is dev-oriented (bind-mounted source,
      # dockerfile_inline never COPYs the app in) — a real deployable image
      # comes from docker/Dockerfile.prod + docker-compose.prod.yml instead,
      # which bakes the app in and drops the bind mount (see that compose
      # file's own top comment for why this distinction matters for Watchtower).
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/loki495/homie:demo
            ghcr.io/loki495/homie:sha-${{ steps.vars.outputs.short_sha }}
