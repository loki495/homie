name: homie

x-app-dockerfile: &app-dockerfile |
  FROM composer:latest AS composer
  FROM php:8.5-apache AS base
  COPY --from=composer /usr/bin/composer /usr/local/bin/composer
  COPY docker/setup-dev-container.sh /tmp/setup.sh
  RUN chmod +x /tmp/setup.sh && /usr/bin/bash /tmp/setup.sh

  FROM base AS test
  COPY docker/setup-test-container.sh /tmp/setup-test.sh
  RUN chmod +x /tmp/setup-test.sh && /usr/bin/bash /tmp/setup-test.sh

services:
  app:
    container_name: homie-app
    restart: unless-stopped
    # Published so a fresh clone can reach the app with zero external setup — the
    # actual production/LAN routing (Traefik host rules, DNS) lives outside this
    # repo, in your own reverse-proxy config, not something a clone gets for
    # free. Override the host port with APP_PORT in .env if 8090 collides with
    # something else already running.
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/logs:/var/www/html/logs:rw
      - ./storage/ssh:/var/www/html/storage/ssh:rw
    build:
      context: .
      target: base
      dockerfile_inline: *app-dockerfile
    # `default` (implicit) for everything else; `sandbox-net` only to reach
    # output-sandbox (demo mode only) - kept off that network entirely for a
    # normal, non-demo run, and output-sandbox itself is never on `default`,
    # so it has no route to mock-sonarr/mock-radarr/vite even in demo mode.
    networks:
      - default
      - sandbox-net

  # Browser (Pest + Playwright) tests only — never started by a plain `docker compose
  # up`. Adds Node.js + Chromium on top of the same `base` image `app` uses, kept out
  # of `app` itself since that image also serves production over the tunnel (see
  # CLAUDE.md) and shouldn't carry a JS runtime + browser binary just for dev-time
  # tests. Run with: docker compose --profile test run --rm app-test ./vendor/bin/pest tests/Browser
  # History: this service used to be attached to an external `web` Traefik network
  # (removed repo-wide — see README's "Local development" and "If you run this behind
  # Traefik" sections) that only existed on a developer's machine; attaching to it
  # broke this job outright in CI with "network web declared as external, but could
  # not be found" the first time it ran there.
  app-test:
    container_name: homie-app-test
    profiles: ["test"]
    volumes:
      - ./:/var/www/html
      - ./docker/logs:/var/www/html/logs:rw
      - ./storage/ssh:/var/www/html/storage/ssh:rw
    build:
      context: .
      target: test
      dockerfile_inline: *app-dockerfile

  vite:
    image: node:20
    container_name: homie-vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/@vite/client"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./:/var/www/html

  # Demo mode only (config('homie.demo_mode')) — never started by a plain `docker
  # compose up`, same profile-gating pattern as app-test above. Two small mock
  # arr-stack API services (same PHP built-in server, different MOCK_PROVIDER)
  # so a real API card pointed at them shows plausible Sonarr/Radarr-shaped stats
  # via the app's real, unmodified fetcher code — see docker/mock-arr-api/router.php
  # and config/homie.php's demo_mock_sonarr_url/demo_mock_radarr_url. Reachable from
  # `app` via this compose file's default network using the service name
  # (mock-sonarr/mock-radarr) — the published host ports below are only for
  # inspecting the mock servers directly, homie itself never uses them.
  mock-sonarr:
    container_name: homie-mock-sonarr
    profiles: ["demo"]
    image: php:8.3-cli-alpine
    restart: unless-stopped
    environment:
      MOCK_PROVIDER: sonarr
    volumes:
      - ./docker/mock-arr-api:/mock:ro
    command: ["php", "-S", "0.0.0.0:80", "-t", "/mock", "/mock/router.php"]
    ports:
      - "${DEMO_MOCK_SONARR_PORT:-8191}:80"

  mock-radarr:
    container_name: homie-mock-radarr
    profiles: ["demo"]
    image: php:8.3-cli-alpine
    restart: unless-stopped
    environment:
      MOCK_PROVIDER: radarr
    volumes:
      - ./docker/mock-arr-api:/mock:ro
    command: ["php", "-S", "0.0.0.0:80", "-t", "/mock", "/mock/router.php"]
    ports:
      - "${DEMO_MOCK_RADARR_PORT:-8192}:80"

  # Locked-down SSH target for the output-card feature's demo (see
  # docker/ssh-sandbox/README.md for the full threat model and adversarial
  # test results). Deliberately on its own network with nothing else on it
  # besides `app` - no route to mock-sonarr/mock-radarr/vite/the host.
  output-sandbox:
    container_name: homie-output-sandbox
    profiles: ["demo"]
    build:
      context: ./docker/ssh-sandbox
    restart: unless-stopped
    cap_drop:
      - ALL
    # The minimum sshd itself needs to function at all under a full cap_drop
    # - confirmed by hand, not guessed: SYS_CHROOT for its own pre-auth
    # privilege-separation chroot into /var/empty, SETUID/SETGID to drop from
    # root to the sandbox user post-auth. Nothing broader than that.
    cap_add:
      - SYS_CHROOT
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox-net
    ports:
      - "${DEMO_OUTPUT_SANDBOX_PORT:-2222}:2222"

networks:
  default: {}
  sandbox-net:
    driver: bridge
